schema_version: 1

context:
  name: openai
  version: "3.8.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/openai/openai-python/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 4c3b269bb0925307d2411866a34aef0fc960e5379f31f0bef4d2975c43db6a70

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - hatchling
    - hatch-fancy-pypi-readme
    - pip
    - python ${{ python_min }}.*
  run:
    - httpx2 >=2.7.0,<3
    - typing_extensions >=4.14,<5
    - jiter >=0.16.0,<1
    - sniffio
    - anyio >=4.10.0,<5
    - pydantic >=1.10.13,<3,!=2.0.*,!=2.1.*,!=2.2.*,!=2.3.*
    - python >=${{ python_min }}
tests:
  - python:
      imports:
        - openai
      pip_check: true
      python_version:
        - ${{ python_min }}
        - '*'

about:
  summary: Python client library for the OpenAI API
  description: |
    The OpenAI Python library provides convenient access to the OpenAI API
    from applications written in the Python language.
    It includes a pre-defined set of classes for API resources that initialize
    themselves dynamically from API responses which makes it compatible with
    a wide range of versions of the OpenAI API.

    This library additionally provides an `openai` command-line utility which
    makes it easy to interact with the API from your terminal.
    Run `openai api -h` for usage.
  license: MIT
  license_file: LICENSE
  homepage: https://beta.openai.com
  repository: https://github.com/openai/openai-python
  documentation: https://platform.openai.com/docs/api-reference?lang=python

extra:
  recipe-maintainers:
    - timkpaine
    - BastianZim
