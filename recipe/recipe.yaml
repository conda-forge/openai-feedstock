schema_version: 1

context:
  name: openai
  version: "2.54.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/openai/openai-python/archive/refs/tags/v${{ version }}.tar.gz
  sha256: f40a70b2be948a9436f322f790e2bd1ff815cf10651e204d203d167231804eaa

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling ==1.26.3
    - hatch-fancy-pypi-readme
    - pip
  run:
    - python >=${{ python_min }}
    - httpx >=0.23.0,<1
    - distro >=1.7.0,<2
    - tqdm >4
    - typing_extensions >=4.14,<5
    - jiter >=0.10.0,<1
    - sniffio
    - anyio >=3.5.0,<5
    - pydantic >=1.9.0,<3
tests:
  - python:
      imports:
        - openai
        - openai.resources.responses
        - openai.resources.chat
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'

  - script:
      - python -c "import openai; assert openai.__version__ == '${{ version }}'; c = openai.OpenAI(api_key='test-key'); assert c.responses is not None; c.close()"
    requirements:
      run:
        - python ${{ python_min }}.*

about:
  summary: Python client library for the OpenAI API
  description: |
    The OpenAI Python library provides convenient access to the OpenAI API
    from applications written in the Python language.
    It includes a pre-defined set of classes for API resources that initialize
    themselves dynamically from API responses which makes it compatible with
    a wide range of versions of the OpenAI API.

    This library additionally provides an `openai` command-line utility which
    makes it easy to interact with the API from your terminal.
    Run `openai api -h` for usage.
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://beta.openai.com
  repository: https://github.com/openai/openai-python
  documentation: https://platform.openai.com/docs/api-reference?lang=python

extra:
  recipe-maintainers:
    - timkpaine
    - BastianZim
